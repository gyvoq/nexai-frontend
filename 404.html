<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<link rel="icon" type="image/svg+xml" href="assets/favicon.svg"/>
<title>Página não encontrada — Viralyze</title>
<meta name="robots" content="noindex"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Serif:ital@0;1&family=Instrument+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --ink: #000000;
  --text: #ffffff;
  --pink: #8b5cf6;
  --glow-pink: rgba(139,92,246,0.32);
  --glass-shine: inset 0 1px 0 rgba(255,255,255,0.14), inset 0 0 0 1px rgba(255,255,255,0.04);
}

html, body {
  height: 100%;
  overflow: hidden;
}

body {
  font-family: 'Instrument Sans', sans-serif;
  background: var(--ink);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  -webkit-font-smoothing: antialiased;
  padding: 2rem 5%;
}

a:focus-visible, button:focus-visible {
  outline: 2px solid var(--pink);
  outline-offset: 3px;
  border-radius: 4px;
}

.bg-orb {
  position: absolute;
  border-radius: 50%;
  filter: blur(90px);
  pointer-events: none;
  z-index: 0;
}
.bg-orb-1 {
  width: 500px; height: 500px;
  background: radial-gradient(circle, rgba(139,92,246,0.16) 0%, transparent 70%);
  top: -160px; left: 50%; transform: translateX(-50%);
}
.bg-orb-2 {
  width: 420px; height: 340px;
  background: radial-gradient(circle, rgba(255,255,255,0.05) 0%, transparent 70%);
  bottom: -100px; right: -80px;
}

.card {
  position: relative;
  z-index: 1;
  max-width: 460px;
  width: 100%;
  text-align: center;
  background: rgba(255,255,255,0.04);
  backdrop-filter: blur(28px) saturate(180%);
  -webkit-backdrop-filter: blur(28px) saturate(180%);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 24px;
  padding: 3rem 2rem;
  box-shadow: var(--glass-shine), 0 8px 32px rgba(0,0,0,0.35);
}

.eyebrow {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  background: rgba(255,255,255,0.06);
  border: 1px solid rgba(255,255,255,0.18);
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  padding: 0.45rem 0.9rem;
  border-radius: 100px;
  margin-bottom: 1.6rem;
}
.eyebrow-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--pink); }

.code {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-weight: 800;
  font-size: clamp(3.5rem, 12vw, 5.5rem);
  letter-spacing: -0.04em;
  line-height: 1;
  background: linear-gradient(135deg, #ffffff 0%, rgba(255,255,255,0.55) 100%);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  margin-bottom: 0.6rem;
}
.code span {
  color: var(--pink);
  -webkit-text-fill-color: var(--pink);
}

h1 {
  font-family: 'Bricolage Grotesque', sans-serif;
  font-size: 1.4rem;
  font-weight: 700;
  letter-spacing: -0.02em;
  margin-bottom: 0.7rem;
}

p {
  font-size: 0.92rem;
  line-height: 1.7;
  color: rgba(255,255,255,0.65);
  margin-bottom: 2rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}

.btn-primary, .btn-ghost {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  padding: 0.8rem 1.6rem;
  border-radius: 100px;
  font-size: 0.88rem;
  font-weight: 700;
  text-decoration: none;
  letter-spacing: -0.01em;
  transition: opacity 0.2s, transform 0.15s;
}

.btn-primary {
  background: linear-gradient(135deg, var(--pink) 0%, #6d28d9 100%);
  color: #fff;
  box-shadow: 0 4px 30px var(--glow-pink), inset 0 1px 0 rgba(255,255,255,0.3);
}
.btn-primary:hover { transform: translateY(-2px); }

.btn-ghost {
  background: rgba(255,255,255,0.06);
  color: var(--text);
  border: 1px solid rgba(255,255,255,0.18);
}
.btn-ghost:hover { background: rgba(255,255,255,0.1); }

@media (max-width: 400px) {
  .card { padding: 2.2rem 1.4rem; }
  .actions { flex-direction: column; }
  .btn-primary, .btn-ghost { justify-content: center; }
}

@media (max-height: 640px) {
  .card { padding: 1.6rem 1.6rem; }
  .eyebrow { margin-bottom: 1rem; }
  .code { margin-bottom: 0.3rem; }
  p { margin-bottom: 1.2rem; }
}
</style>
</head>
<body>

<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>

<div class="card">
  <div class="eyebrow"><span class="eyebrow-dot"></span>Erro 404</div>
  <div class="code">4<span>0</span>4</div>
  <h1>Essa página não existe</h1>
  <p>O link pode estar quebrado ou a página foi movida. Volte para o início e continue de onde parou.</p>
  <div class="actions">
    <a href="/landing/landing.html" class="btn-primary">
      Voltar para o início
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
    </a>
    <a href="/" class="btn-ghost">Ir para o app</a>
  </div>
</div>

</body>
</html>
