<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; object-src 'none'; base-uri 'self'; form-action 'none'"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
<meta name="color-scheme" content="dark"/>
<meta name="robots" content="noindex"/>
<script src="/js/i18n.js"></script>
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg"/>
<title>Página não encontrada — Viralyze</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #000000;
  --text: #ffffff;
  --muted: rgba(255,255,255,0.65);
  --purple: #8b5cf6;
  --border: rgba(255,255,255,0.18);
}

html { color-scheme: dark; -webkit-text-size-adjust: 100%; }

body {
  font-family: 'Inter', system-ui, -apple-system, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  min-height: 100dvh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: max(2rem, env(safe-area-inset-top)) max(1.5rem, env(safe-area-inset-right)) max(2rem, env(safe-area-inset-bottom)) max(1.5rem, env(safe-area-inset-left));
  -webkit-font-smoothing: antialiased;
  -webkit-tap-highlight-color: transparent;
}

a:focus-visible {
  outline: 2px solid var(--purple);
  outline-offset: 3px;
}

main {
  width: 100%;
  max-width: 680px;
  text-align: center;
}

h1, p, .actions {
  max-width: 460px;
  margin-left: auto;
  margin-right: auto;
}

.art {
  display: block;
  width: auto;
  max-width: 100%;
  max-height: 48vh;
  max-height: 48dvh;
  height: auto;
  margin: 0 auto 1.5rem;
  object-fit: contain;
}

.code {
  font-size: clamp(3rem, 12vw, 4.5rem);
  font-weight: 700;
  letter-spacing: -0.03em;
  line-height: 1;
  margin-bottom: 0.9rem;
}

h1 {
  font-size: 1.35rem;
  font-weight: 600;
  letter-spacing: -0.01em;
  margin-bottom: 0.7rem;
}

p {
  font-size: 0.95rem;
  line-height: 1.65;
  color: var(--muted);
  margin-bottom: 1.9rem;
}

.actions {
  display: flex;
  flex-wrap: wrap;
  gap: 0.75rem;
  justify-content: center;
}

.btn-primary, .btn-ghost {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 0.5rem;
  min-height: 46px;
  padding: 0.75rem 1.5rem;
  border-radius: 100px;
  font-size: 0.9rem;
  font-weight: 600;
  text-decoration: none;
  transition: opacity 0.15s, background 0.15s;
}

.btn-primary {
  background: var(--purple);
  color: #fff;
  border: 1px solid var(--purple);
}
.btn-primary:hover { opacity: 0.88; }

.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover { background: rgba(255,255,255,0.08); }

@media (max-width: 480px) {
  .actions { flex-direction: column; }
  .btn-primary, .btn-ghost { width: 100%; }
}

@media (max-height: 600px) {
  .art { max-height: 38vh; max-height: 38dvh; margin-bottom: 1rem; }
  p { margin-bottom: 1.2rem; }
}

@media (prefers-reduced-motion: reduce) {
  * { transition: none !important; }
}
</style>
</head>
<body>

<main>
  <img class="art" src="/assets/404.avif" alt="" fetchpriority="high" decoding="async"/>
  <div class="code">404</div>
  <h1>Essa página não existe</h1>
  <p>O link pode estar quebrado ou a página foi movida. Volte para o início e continue de onde parou.</p>
  <div class="actions">
    <a href="/landing/landing.html" class="btn-primary">
      Voltar para o início
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
    </a>
    <a href="/" class="btn-ghost">Ir para o app</a>
  </div>
</main>

</body>
</html>
