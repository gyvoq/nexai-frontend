<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nex AI — Painel Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #070709;
  --surface: #0f0f13;
  --surface2: #14141a;
  --surface3: #1a1a22;
  --border: #1e1e28;
  --border2: #26263a;
  --text: #eeeef5;
  --text2: #9898b0;
  --text3: #55556a;
  --accent1: #7c6bff;
  --accent2: #ff6b8a;
  --accent3: #00e5b3;
  --accent4: #f5c542;
  --radius: 12px;
  --radius-sm: 8px;
}
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; -webkit-font-smoothing: antialiased; }

/* LOGIN */
#login-screen {
  position: fixed; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); z-index: 100;
}
.login-card {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 20px; padding: 36px 32px;
  width: 100%; max-width: 380px; text-align: center;
}
.login-logo { display: flex; align-items: center; justify-content: center; gap: 10px; margin-bottom: 24px; }
.login-logo-icon { width: 36px; height: 36px; background: linear-gradient(135deg, var(--accent1), var(--accent2)); border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.login-logo-icon svg { width: 18px; height: 18px; stroke: white; fill: none; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
.login-logo-text { font-size: 18px; font-weight: 700; background: linear-gradient(90deg, #fff, #888); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.login-title { font-size: 17px; font-weight: 700; margin-bottom: 6px; }
.login-sub { font-size: 13px; color: var(--text2); margin-bottom: 22px; }
.login-input {
  width: 100%; background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); color: var(--text); font-size: 14px;
  padding: 11px 14px; font-family: 'Inter', sans-serif; outline: none;
  transition: border-color 0.2s; margin-bottom: 12px;
}
.login-input:focus { border-color: var(--accent1); }
.login-btn {
  width: 100%; padding: 12px;
  background: linear-gradient(135deg, var(--accent1), var(--accent2));
  border: none; border-radius: var(--radius-sm); color: white;
  font-size: 14px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
  transition: opacity 0.2s;
}
.login-btn:hover { opacity: 0.9; }
.login-error { color: var(--accent2); font-size: 12.5px; margin-top: 8px; min-height: 18px; }

/* MAIN */
#main { display: none; min-height: 100vh; }
.header {
  background: rgba(7,7,9,0.95); border-bottom: 1px solid var(--border);
  padding: 0 24px; height: 58px;
  display: flex; align-items: center; justify-content: space-between;
  position: sticky; top: 0; z-index: 50;
  backdrop-filter: blur(20px);
}
.header-logo { display: flex; align-items: center; gap: 9px; font-size: 15px; font-weight: 700; }
.header-logo-icon { width: 28px; height: 28px; background: linear-gradient(135deg, var(--accent1), var(--accent2)); border-radius: 8px; display: flex; align-items: center; justify-content: center; }
.header-logo-icon svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2.2; }
.admin-badge { font-size: 9px; font-weight: 700; background: rgba(255,107,138,0.15); color: var(--accent2); border: 1px solid rgba(255,107,138,0.3); padding: 2px 8px; border-radius: 8px; letter-spacing: 1px; }
.logout-btn {
  background: var(--surface2); border: 1px solid var(--border2);
  color: var(--text2); font-size: 12px; font-weight: 600;
  padding: 6px 13px; border-radius: var(--radius-sm); cursor: pointer;
  font-family: 'Inter', sans-serif; transition: all 0.2s;
}
.logout-btn:hover { border-color: var(--accent2); color: var(--accent2); }

.content { padding: 28px 24px; max-width: 1200px; margin: 0 auto; }

/* STATS */
.stats-row { display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); gap: 12px; margin-bottom: 28px; }
.stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; }
.stat-value { font-size: 32px; font-weight: 700; line-height: 1; }
.stat-label { font-size: 12px; color: var(--text2); margin-top: 5px; }
.stat-total .stat-value { background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
.stat-active .stat-value { color: var(--accent3); }
.stat-expired .stat-value { color: var(--accent2); }
.stat-unused .stat-value { color: var(--accent4); }

/* CRIAR LICENÇA */
.create-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 20px; margin-bottom: 24px; }
.card-title { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; color: var(--text2); margin-bottom: 16px; }
.create-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
.form-group { display: flex; flex-direction: column; gap: 6px; }
.form-label { font-size: 11px; font-weight: 600; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; }
.form-select, .form-input-sm {
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius-sm); color: var(--text); font-size: 13px;
  padding: 9px 12px; font-family: 'Inter', sans-serif; outline: none;
  transition: border-color 0.2s; cursor: pointer; min-width: 140px;
}
.form-select:focus, .form-input-sm:focus { border-color: var(--accent1); }
.qty-row { display: flex; align-items: center; gap: 8px; }
.qty-btn {
  width: 32px; height: 32px; background: var(--surface3); border: 1px solid var(--border2);
  border-radius: 8px; color: var(--text); font-size: 18px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.2s; font-family: 'Inter', sans-serif;
}
.qty-btn:hover { border-color: var(--accent1); color: var(--accent1); }
.qty-display { font-size: 16px; font-weight: 700; min-width: 32px; text-align: center; }
.create-btn {
  padding: 10px 22px; background: linear-gradient(135deg, var(--accent1), var(--accent2));
  border: none; border-radius: var(--radius-sm); color: white;
  font-size: 13.5px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif;
  transition: all 0.2s; white-space: nowrap;
  display: flex; align-items: center; gap: 7px;
}
.create-btn:hover { opacity: 0.9; transform: translateY(-1px); }
.create-btn:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
.create-btn svg { width: 14px; height: 14px; stroke: white; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* RESULTADO DA CRIAÇÃO */
.created-keys-box {
  margin-top: 14px; background: var(--surface2); border: 1px solid rgba(0,229,179,0.25);
  border-radius: var(--radius-sm); padding: 14px; display: none;
}
.created-keys-title { font-size: 11px; font-weight: 700; color: var(--accent3); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 10px; }
.keys-list { display: flex; flex-wrap: wrap; gap: 7px; margin-bottom: 10px; }
.key-chip {
  background: rgba(0,229,179,0.08); border: 1px solid rgba(0,229,179,0.25);
  border-radius: 8px; padding: 5px 12px; font-size: 14px; font-weight: 700;
  color: var(--accent3); font-family: monospace; letter-spacing: 1px; cursor: pointer;
  transition: background 0.15s;
}
.key-chip:hover { background: rgba(0,229,179,0.15); }
.copy-all-btn {
  background: none; border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text2); font-size: 11.5px; font-weight: 600; padding: 5px 12px;
  cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s;
}
.copy-all-btn:hover { border-color: var(--accent3); color: var(--accent3); }

/* FILTROS */
.filters-row { display: flex; gap: 7px; margin-bottom: 16px; flex-wrap: wrap; align-items: center; justify-content: space-between; }
.filter-chips { display: flex; gap: 6px; flex-wrap: wrap; }
.filter-chip {
  padding: 6px 13px; border-radius: 20px; border: 1px solid var(--border2);
  background: var(--surface); color: var(--text2); font-size: 12px; font-weight: 500;
  cursor: pointer; transition: all 0.2s; font-family: 'Inter', sans-serif;
}
.filter-chip:hover { border-color: var(--accent1); color: var(--text); }
.filter-chip.active { background: linear-gradient(135deg, var(--accent1), var(--accent2)); border-color: transparent; color: white; }
.search-input {
  background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text); font-size: 13px; padding: 7px 12px;
  font-family: 'Inter', sans-serif; outline: none; transition: border-color 0.2s; width: 200px;
}
.search-input:focus { border-color: var(--accent1); }
.refresh-btn {
  background: var(--surface); border: 1px solid var(--border2); border-radius: var(--radius-sm);
  color: var(--text2); padding: 7px 12px; cursor: pointer; transition: all 0.2s;
  display: flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 600; font-family: 'Inter', sans-serif;
}
.refresh-btn:hover { border-color: var(--accent1); color: var(--text); }
.refresh-btn svg { width: 13px; height: 13px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

/* TABELA */
.table-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); overflow: hidden; }
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; }
thead { background: var(--surface2); }
th { padding: 11px 14px; text-align: left; font-size: 10.5px; font-weight: 700; color: var(--text2); text-transform: uppercase; letter-spacing: 1px; white-space: nowrap; }
td { padding: 12px 14px; font-size: 13px; border-top: 1px solid var(--border); white-space: nowrap; }
tr:hover td { background: rgba(124,107,255,0.03); }

.key-cell { font-family: monospace; font-size: 15px; font-weight: 700; color: var(--text); letter-spacing: 1px; }
.date-cell { color: var(--text2); font-size: 12px; }

/* BADGES */
.badge { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 20px; font-size: 10.5px; font-weight: 700; letter-spacing: 0.3px; }
.badge-active { background: rgba(0,229,179,0.12); color: var(--accent3); border: 1px solid rgba(0,229,179,0.25); }
.badge-expired { background: rgba(255,107,138,0.12); color: var(--accent2); border: 1px solid rgba(255,107,138,0.25); }
.badge-unused { background: rgba(245,197,66,0.12); color: var(--accent4); border: 1px solid rgba(245,197,66,0.25); }
.badge-revoked { background: rgba(150,150,150,0.12); color: var(--text3); border: 1px solid rgba(150,150,150,0.2); }
.badge-dot { width: 5px; height: 5px; border-radius: 50%; background: currentColor; }

/* AÇÕES */
.action-btns { display: flex; gap: 6px; }
.action-btn {
  padding: 5px 11px; border-radius: 7px; font-size: 11.5px; font-weight: 600;
  cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; border: 1px solid;
  display: flex; align-items: center; gap: 4px;
}
.action-btn svg { width: 11px; height: 11px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.btn-revoke { background: rgba(245,197,66,0.08); border-color: rgba(245,197,66,0.25); color: var(--accent4); }
.btn-revoke:hover { background: rgba(245,197,66,0.15); }
.btn-delete { background: rgba(255,107,138,0.08); border-color: rgba(255,107,138,0.25); color: var(--accent2); }
.btn-delete:hover { background: rgba(255,107,138,0.15); }
.btn-copy { background: rgba(124,107,255,0.08); border-color: rgba(124,107,255,0.25); color: var(--accent1); }
.btn-copy:hover { background: rgba(124,107,255,0.15); }

.empty-table { text-align: center; padding: 48px 20px; color: var(--text3); font-size: 13px; }

/* TOAST */
.toast {
  position: fixed; bottom: 24px; left: 50%;
  transform: translateX(-50%) translateY(16px);
  background: var(--surface2); border: 1px solid var(--border2);
  border-radius: var(--radius); padding: 10px 18px;
  font-size: 13.5px; font-weight: 500; color: var(--text);
  z-index: 300; opacity: 0; transition: all 0.28s;
  display: flex; align-items: center; gap: 8px;
  box-shadow: 0 8px 30px rgba(0,0,0,0.4); white-space: nowrap;
}
.toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
.toast svg { width: 14px; height: 14px; stroke: var(--accent3); fill: none; stroke-width: 2.5; }

/* MODAL CONFIRM */
.modal-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.8);
  z-index: 200; display: flex; align-items: center; justify-content: center;
  backdrop-filter: blur(8px); opacity: 0; pointer-events: none; transition: opacity 0.2s;
}
.modal-overlay.open { opacity: 1; pointer-events: all; }
.modal {
  background: var(--surface); border: 1px solid var(--border2);
  border-radius: 16px; padding: 26px; max-width: 360px; width: 100%;
  text-align: center; transform: translateY(12px); transition: transform 0.2s;
}
.modal-overlay.open .modal { transform: translateY(0); }
.modal-title { font-size: 16px; font-weight: 700; margin-bottom: 8px; }
.modal-msg { font-size: 13px; color: var(--text2); margin-bottom: 20px; line-height: 1.6; }
.modal-btns { display: flex; gap: 9px; }
.modal-cancel { flex: 1; padding: 10px; background: var(--surface2); border: 1px solid var(--border2); border-radius: var(--radius-sm); color: var(--text); font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: all 0.2s; }
.modal-cancel:hover { border-color: var(--accent1); }
.modal-confirm { flex: 1; padding: 10px; background: linear-gradient(135deg, var(--accent2), #ff8c5a); border: none; border-radius: var(--radius-sm); color: white; font-size: 13px; font-weight: 600; cursor: pointer; font-family: 'Inter', sans-serif; transition: opacity 0.2s; }
.modal-confirm:hover { opacity: 0.9; }

.loading { text-align: center; padding: 40px; color: var(--text3); }
</style>
</head>
<body>

<!-- LOGIN -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-logo">
      <div class="login-logo-icon">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      <span class="login-logo-text">Nex AI</span>
    </div>
    <div class="login-title">Painel Admin</div>
    <div class="login-sub">Digite a senha de administrador para continuar</div>
    <input type="password" class="login-input" id="secret-input" placeholder="Senha admin..." autocomplete="off">
    <button class="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- MAIN -->
<div id="main">
  <header class="header">
    <div class="header-logo">
      <div class="header-logo-icon">
        <svg viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>
      </div>
      Nex AI
      <span class="admin-badge">ADMIN</span>
    </div>
    <button class="logout-btn" onclick="doLogout()">Sair</button>
  </header>

  <div class="content">

    <!-- STATS -->
    <div class="stats-row" id="stats-row">
      <div class="stat-card stat-total"><div class="stat-value" id="stat-total">—</div><div class="stat-label">Total de licenças</div></div>
      <div class="stat-card stat-active"><div class="stat-value" id="stat-active">—</div><div class="stat-label">Ativas</div></div>
      <div class="stat-card stat-expired"><div class="stat-value" id="stat-expired">—</div><div class="stat-label">Expiradas</div></div>
      <div class="stat-card stat-unused"><div class="stat-value" id="stat-unused">—</div><div class="stat-label">Nunca usadas</div></div>
    </div>

    <!-- CRIAR -->
    <div class="create-card">
      <div class="card-title">Criar Novas Licenças</div>
      <div class="create-row">
        <div class="form-group">
          <label class="form-label">Validade</label>
          <select class="form-select" id="validity-select">
            <option value="1">1 mês</option>
            <option value="3">3 meses</option>
            <option value="6">6 meses</option>
            <option value="12">12 meses</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Quantidade</label>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(-1)">−</button>
            <span class="qty-display" id="qty-display">1</span>
            <button class="qty-btn" onclick="changeQty(1)">+</button>
          </div>
        </div>
        <button class="create-btn" id="create-btn" onclick="createLicenses()">
          <svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          Criar Licenças
        </button>
      </div>
      <div class="created-keys-box" id="created-keys-box">
        <div class="created-keys-title">✓ Licenças criadas com sucesso</div>
        <div class="keys-list" id="keys-list"></div>
        <button class="copy-all-btn" onclick="copyAllKeys()">Copiar todas</button>
      </div>
    </div>

    <!-- LISTA -->
    <div class="filters-row">
      <div class="filter-chips">
        <button class="filter-chip active" data-filter="all" onclick="setFilter('all',this)">Todas</button>
        <button class="filter-chip" data-filter="active" onclick="setFilter('active',this)">✅ Ativas</button>
        <button class="filter-chip" data-filter="unused" onclick="setFilter('unused',this)">⏳ Não usadas</button>
        <button class="filter-chip" data-filter="expired" onclick="setFilter('expired',this)">❌ Expiradas</button>
        <button class="filter-chip" data-filter="revoked" onclick="setFilter('revoked',this)">🚫 Revogadas</button>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        <input type="search" class="search-input" placeholder="Buscar chave..." oninput="filterTable()" id="search-input">
        <button class="refresh-btn" onclick="loadLicenses()">
          <svg viewBox="0 0 24 24"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
          Atualizar
        </button>
      </div>
    </div>

    <div class="table-card">
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Chave</th>
              <th>Status</th>
              <th>Validade</th>
              <th>Criada em</th>
              <th>Ativada em</th>
              <th>Expira em</th>
              <th>Ações</th>
            </tr>
          </thead>
          <tbody id="licenses-tbody">
            <tr><td colspan="7" class="loading">Carregando...</td></tr>
          </tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast">
  <svg viewBox="0 0 24 24"><polyline points="20 6 9 17 4 12"/></svg>
  <span id="toast-msg"></span>
</div>

<!-- MODAL CONFIRM -->
<div class="modal-overlay" id="confirm-modal">
  <div class="modal">
    <div class="modal-title" id="confirm-title">Confirmar</div>
    <div class="modal-msg" id="confirm-msg"></div>
    <div class="modal-btns">
      <button class="modal-cancel" onclick="closeConfirm()">Cancelar</button>
      <button class="modal-confirm" id="confirm-ok">Confirmar</button>
    </div>
  </div>
</div>

<script>
const API = 'https://nexai-backend-production-5e36.up.railway.app';
let adminSecret = '';
let allLicenses = [];
let currentFilter = 'all';
let createdKeys = [];
let qty = 1;

// ── LOGIN ──────────────────────────────────────────────────────────
function doLogin() {
  const val = document.getElementById('secret-input').value.trim();
  if (!val) { showLoginError('Digite a senha.'); return; }
  adminSecret = val;
  // Testa com uma chamada real
  fetch(`${API}/api/admin/licenses`, {
    headers: { 'X-Admin-Secret': adminSecret }
  }).then(r => {
    if (r.status === 401 || r.status === 403) {
      showLoginError('Senha incorreta.');
      adminSecret = '';
    } else if (r.ok) {
      document.getElementById('login-screen').style.display = 'none';
      document.getElementById('main').style.display = 'block';
      r.json().then(data => { allLicenses = data; renderTable(); updateStats(); });
    } else {
      showLoginError('Erro ao conectar. Servidor está rodando?');
    }
  }).catch(() => showLoginError('Servidor offline. Inicie o backend primeiro.'));
}

function showLoginError(msg) {
  document.getElementById('login-error').textContent = msg;
}

function doLogout() {
  adminSecret = '';
  allLicenses = [];
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('main').style.display = 'none';
  document.getElementById('secret-input').value = '';
  document.getElementById('login-error').textContent = '';
}

document.getElementById('secret-input').addEventListener('keydown', e => {
  if (e.key === 'Enter') doLogin();
});

// ── LOAD ──────────────────────────────────────────────────────────
function loadLicenses() {
  fetch(`${API}/api/admin/licenses`, {
    headers: { 'X-Admin-Secret': adminSecret }
  }).then(r => r.json()).then(data => {
    allLicenses = data;
    renderTable();
    updateStats();
    showToast('Atualizado!');
  }).catch(() => showToast('Erro ao carregar licenças'));
}

// ── STATS ──────────────────────────────────────────────────────────
function updateStats() {
  const total = allLicenses.length;
  const active = allLicenses.filter(l => l.activated && !l.expired && !l.revoked).length;
  const expired = allLicenses.filter(l => l.expired && !l.revoked).length;
  const unused = allLicenses.filter(l => !l.activated && !l.revoked).length;
  document.getElementById('stat-total').textContent = total;
  document.getElementById('stat-active').textContent = active;
  document.getElementById('stat-expired').textContent = expired;
  document.getElementById('stat-unused').textContent = unused;
}

// ── CRIAR ──────────────────────────────────────────────────────────
function changeQty(delta) {
  qty = Math.max(1, Math.min(50, qty + delta));
  document.getElementById('qty-display').textContent = qty;
}

async function createLicenses() {
  const months = parseInt(document.getElementById('validity-select').value);
  const btn = document.getElementById('create-btn');
  btn.disabled = true;
  btn.textContent = 'Criando...';
  createdKeys = [];

  for (let i = 0; i < qty; i++) {
    const r = await fetch(`${API}/api/admin/licenses`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'X-Admin-Secret': adminSecret },
      body: JSON.stringify({ validityMonths: months })
    });
    if (r.ok) {
      const d = await r.json();
      createdKeys.push(d.key);
    }
  }

  btn.disabled = false;
  btn.innerHTML = '<svg viewBox="0 0 24 24"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg> Criar Licenças';

  if (createdKeys.length > 0) {
    const box = document.getElementById('created-keys-box');
    const list = document.getElementById('keys-list');
    list.innerHTML = createdKeys.map(k =>
      `<span class="key-chip" onclick="navigator.clipboard.writeText('${k}');showToast('Chave copiada!')" title="Clique para copiar">${k}</span>`
    ).join('');
    box.style.display = 'block';
    loadLicenses();
    showToast(`${createdKeys.length} licença(s) criada(s)!`);
  }
}

function copyAllKeys() {
  navigator.clipboard.writeText(createdKeys.join('\n')).then(() => showToast('Todas as chaves copiadas!'));
}

// ── FILTRO ─────────────────────────────────────────────────────────
function setFilter(filter, el) {
  currentFilter = filter;
  document.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
  el.classList.add('active');
  renderTable();
}

function getStatus(l) {
  if (l.revoked) return 'revoked';
  if (!l.activated) return 'unused';
  if (l.expired) return 'expired';
  return 'active';
}

function filterTable() { renderTable(); }

function renderTable() {
  const q = document.getElementById('search-input')?.value.toLowerCase() || '';
  let list = allLicenses;

  if (currentFilter !== 'all') {
    list = list.filter(l => getStatus(l) === currentFilter);
  }
  if (q) {
    list = list.filter(l => l.key.toLowerCase().includes(q));
  }

  const tbody = document.getElementById('licenses-tbody');

  if (list.length === 0) {
    tbody.innerHTML = `<tr><td colspan="7" class="empty-table">Nenhuma licença encontrada</td></tr>`;
    return;
  }

  const fmt = iso => iso ? new Date(iso).toLocaleDateString('pt-BR', { day:'2-digit', month:'2-digit', year:'2-digit' }) : '—';

  tbody.innerHTML = list.map(l => {
    const status = getStatus(l);
    const badges = {
      active:  '<span class="badge badge-active"><span class="badge-dot"></span>Ativa</span>',
      expired: '<span class="badge badge-expired"><span class="badge-dot"></span>Expirada</span>',
      unused:  '<span class="badge badge-unused"><span class="badge-dot"></span>Não usada</span>',
      revoked: '<span class="badge badge-revoked"><span class="badge-dot"></span>Revogada</span>',
    };
    const revokeBtn = (status !== 'revoked')
      ? `<button class="action-btn btn-revoke" onclick="confirmRevoke('${l.key}')"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>Revogar</button>`
      : '';
    return `<tr>
      <td><span class="key-cell">${l.key}</span></td>
      <td>${badges[status] || ''}</td>
      <td class="date-cell">${l.validityMonths} mês(es)</td>
      <td class="date-cell">${fmt(l.createdAt)}</td>
      <td class="date-cell">${fmt(l.activatedAt)}</td>
      <td class="date-cell">${fmt(l.expiresAt)}</td>
      <td>
        <div class="action-btns">
          <button class="action-btn btn-copy" onclick="navigator.clipboard.writeText('${l.key}');showToast('Chave copiada!')">
            <svg viewBox="0 0 24 24"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 01-2-2V4a2 2 0 012-2h9a2 2 0 012 2v1"/></svg>Copiar
          </button>
          ${revokeBtn}
          <button class="action-btn btn-delete" onclick="confirmDelete('${l.key}')">
            <svg viewBox="0 0 24 24"><polyline points="3 6 5 6 21 6"/><path d="M19 6v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M9 6V4a1 1 0 011-1h4a1 1 0 011 1v2"/></svg>Deletar
          </button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

// ── AÇÕES ──────────────────────────────────────────────────────────
function confirmRevoke(key) {
  showConfirm(
    'Revogar Licença',
    `Revogar a licença <strong>${key}</strong>? O usuário perderá acesso imediatamente.`,
    () => revokeLicense(key)
  );
}

function confirmDelete(key) {
  showConfirm(
    'Deletar Licença',
    `Deletar permanentemente a licença <strong>${key}</strong>? Esta ação não pode ser desfeita.`,
    () => deleteLicense(key)
  );
}

async function revokeLicense(key) {
  const r = await fetch(`${API}/api/admin/licenses/${key}`, {
    method: 'DELETE',
    headers: { 'X-Admin-Secret': adminSecret }
  });
  if (r.ok) { showToast(`Licença ${key} revogada.`); loadLicenses(); }
  else showToast('Erro ao revogar licença');
}

async function deleteLicense(key) {
  const r = await fetch(`${API}/api/admin/licenses/${key}/hard`, {
    method: 'DELETE',
    headers: { 'X-Admin-Secret': adminSecret }
  });
  if (r.ok) { showToast(`Licença ${key} deletada.`); loadLicenses(); }
  else showToast('Erro ao deletar licença');
}

// ── CONFIRM MODAL ──────────────────────────────────────────────────
function showConfirm(title, msg, onOk) {
  document.getElementById('confirm-title').textContent = title;
  document.getElementById('confirm-msg').innerHTML = msg;
  document.getElementById('confirm-modal').classList.add('open');
  const btn = document.getElementById('confirm-ok');
  btn.onclick = () => { closeConfirm(); onOk(); };
}
function closeConfirm() {
  document.getElementById('confirm-modal').classList.remove('open');
}

// ── TOAST ──────────────────────────────────────────────────────────
let toastTimer;
function showToast(msg) {
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  document.getElementById('toast-msg').textContent = msg;
  t.classList.add('show');
  toastTimer = setTimeout(() => t.classList.remove('show'), 2600);
}
</script>
</body>
</html>
